version: '3.8'
services:
  db:
    image: postgres:16.3
    container_name: hookah_db
    environment:
      POSTGRES_DB: hookah_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
